<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZD PULSE — Architecture &amp; Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/zd.css">
<link rel="stylesheet" href="css/zd-ui.css">
</head>
<body>
<div class="app">

  <aside class="rail">
    <div class="rail-mark">ZD</div>
    <nav class="rail-nav" id="railNav" aria-label="Surfaces"></nav>
    <div class="rail-foot">
      <button class="rail-ic" id="btnTheme" data-tip="Switch theme">
        <svg viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11Z"/></svg>
      </button>
      <button class="rail-ic" id="btnOut" data-tip="Log out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
      <div class="rail-av" id="railAv">?</div>
    </div>
  </aside>

  <main class="main">
    <header class="head">
      <div>
        <h1>
          <span class="brand"><b>ZAMEEN</b><span>DEVELOPMENTS</span></span>
          <span class="hdiv"></span>
          <span id="headTitle">EXECUTIVE SUMMARY</span>
        </h1>
        <p id="headSub"></p>
      </div>
      <div class="head-act" id="headAct">
        <div class="hsearch" id="hSearch" role="button" tabindex="0"
             title="Search every register">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>Search anything</span><kbd>Ctrl K</kbd>
        </div>
        <button class="hbell" id="hBell" title="What is waiting on you">
          <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <b id="bellCount" hidden>0</b>
        </button>
      </div>
    </header>
    <div class="page" id="page"><div class="empty">Loading…</div></div>
  </main>
</div>
<script src="js/forms.js"></script>
<script src="js/app.js"></script>
<script src="js/ui-actions.js"></script>
<script src="js/entity.js"></script>
<script src="js/v3.js"></script>
</body>
</html>
